    <rect x="194" y="158" width="114" height="25" rx="12" fill="#fff" opacity=".12"/><circle cx="210" cy="171" r="5" fill="#f5a65b"/><text x="222" y="175" font-size="11" font-weight="700" fill="#e8f6f5">VLESS REALITY</text><text x="194" y="215" font-size="25" font-weight="750" fill="#fff">创建安全入站节点</text><text x="194" y="239" font-size="13" fill="#bcd5d5">配置连接信息，Panel 将负责密钥加密与运行时同步</text><circle cx="947" cy="162" r="16" fill="#fff" opacity=".12"/><path d="m941 156 12 12m0-12-12 12" stroke="#fff" stroke-width="1.5"/>
