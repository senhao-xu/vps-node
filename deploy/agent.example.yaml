panel_url: https://panel.example.com
# Long-lived per-server agent key (Server detail page). Authenticates the agent;
# the panel can reveal or reset it at any time.
agent_key: replace-with-agent-key
# Must match the server the key belongs to (safety cross-check).
server_id: 1
log_level: info
heartbeat_interval: 30
sync_interval: 30
traffic_interval: 60
# Static public IP reported with heartbeats (optional). When empty the agent
# probes `public_ip_url` (default https://api.ipify.org) every 30 minutes and
# reports the result; failures never block the heartbeat.
# public_ip: 203.0.113.7
# public_ip_url: https://api.ipify.org
collection:
  traffic: true
  # Report visited destinations (host/port/network/source IP) to the Panel.
  visits: true
