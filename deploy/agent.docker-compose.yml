services:
  panel-agent:
    image: ${AGENT_IMAGE:-vps-node-agent:latest}
    container_name: vps-node-agent
    restart: unless-stopped
    init: true
    environment:
      AGENT_PANEL_URL: "${AGENT_PANEL_URL:?set AGENT_PANEL_URL, e.g. https://panel.example.com}"
      AGENT_SERVER_ID: "${AGENT_SERVER_ID:?set AGENT_SERVER_ID to the server id shown in the panel}"
      AGENT_REGISTER_TOKEN: ${AGENT_REGISTER_TOKEN:-}
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      AGENT_LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
    ports:
      - "${NODE_PORT:-8388}:8388/tcp"
      - "${NODE_PORT:-8388}:8388/udp"
    volumes:
      - agent-state:/var/lib/panel-agent
      - agent-config:/etc/sing-box

volumes:
  agent-state:
  agent-config:

# The agent image contains agent + sing-box + singbox-reload (all-in-one container;
# sing-box is started by the agent's reload command after each config apply, including
# at startup, so a restart brings sing-box back up).
# Agent identity lives in the agent-state volume; rendered sing-box config lives in the
# agent-config volume so it survives container recreation. Deleting agent-state forces
# re-registration.
#
# Port mapping notes:
# - The example publishes one port for a single shadowsocks/hysteria2 node
#   (8388 tcp+udp). Map one entry per node protocol/port that the server owns,
#   or use network_mode: host when exposing many ports.
# - Ports <=1024 additionally require the container to run as root (it does by default).
